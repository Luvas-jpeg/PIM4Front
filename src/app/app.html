<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
<header class="app-header" [class.app-header--hidden]="isHeaderHidden()">
  <nav class="app-header__content" aria-label="Navegacao principal">
    <a routerLink="/" class="brand">MediShop</a>

    <div class="header-actions">
      <a routerLink="/catalogo" class="nav-link">Catálogo</a>
      <a routerLink="/area-aluno" class="nav-link">Área do aluno</a>

      @if (isAdmin()) {
        <a routerLink="/admin" class="header-link">Admin</a>
      }

      <a
        [routerLink]="user() ? '/conta' : '/login'"
        class="account-link"
        aria-label="Entrar ou acessar conta"
      >
        <span class="account-icon" aria-hidden="true"></span>
        <span class="account-link__text">
          {{ user()?.nome || 'Entrar' }}
        </span>
      </a>

      <a routerLink="/carrinho" class="cart-link" aria-label="Abrir carrinho">
        <span class="cart-link__text">Carrinho</span>

        @if (cartCount() > 0) {
          <span class="cart-link__badge">{{ cartCount() }}</span>
        }
      </a>
    </div>
  </nav>
</header>

<div id="conteudo-principal" tabindex="-1">
  <router-outlet />
</div>

<footer class="app-footer">
  <div class="app-footer__content">
    <div class="app-footer__info">
      <strong class="app-footer__brand">MediShop</strong>
      <p>Cursos presenciais para profissionais da saúde.</p>
    </div>
    <app-accessibility />
    <small class="app-footer__copyright">&copy; 2026 MediShop. Todos os direitos reservados.</small>
  </div>
</footer>
